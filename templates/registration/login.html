{% load widget_tweaks %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In | NovaSpend Financial Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #070A12;
            --bg-card: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --emerald: #10B981;
            --indigo: #6366F1;
            --indigo-glow: rgba(99, 102, 241, 0.35);
        }

        body {
            background-color: var(--bg-dark);
            color: #F8FAFC;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(16, 185, 129, 0.2) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 60%);
            background-attachment: fixed;
            padding: 2rem 1rem;
        }

        h1, h2, h3, h4, h5, .font-heading {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.5px;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.15);
            padding: 2.75rem 2.5rem;
            width: 100%;
            max-width: 440px;
            transition: all 0.3s ease;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 0.5rem;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--indigo), var(--emerald));
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
            font-size: 1.5rem;
            color: #FFF;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.7) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 12px !important;
            color: #F8FAFC !important;
            padding: 0.75rem 1rem 0.75rem 2.75rem !important;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--indigo) !important;
            box-shadow: 0 0 0 4px var(--indigo-glow) !important;
        }

        .input-group-text {
            background: transparent !important;
            border: none !important;
            color: #94A3B8;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            font-size: 1.1rem;
        }

        .btn-signin {
            background: linear-gradient(135deg, var(--indigo), #4F46E5);
            border: none;
            color: #FFF;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            width: 100%;
            font-size: 1rem;
            box-shadow: 0 6px 20px var(--indigo-glow);
            transition: all 0.25s ease;
        }

        .btn-signin:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px var(--indigo-glow);
            color: #FFF;
        }

        .link-muted {
            color: #94A3B8;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .link-muted:hover {
            color: var(--emerald);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="brand-logo">
            <div class="brand-icon"><i class="bi bi-gem"></i></div>
            <h2 class="fw-bold text-white mb-0">NovaSpend</h2>
        </div>
        <p class="text-secondary small">Welcome back! Sign in to access your financial dashboard.</p>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-4" style="background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244, 63, 94, 0.3); color: #F43F5E; border-radius: 12px; font-size: 0.85rem;">
        <i class="bi bi-exclamation-circle-fill fs-5"></i>
        <div>Invalid username or password. Please try again.</div>
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3 position-relative">
            <label class="form-label text-secondary small fw-semibold">Username</label>
            <div class="position-relative">
                <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                <input type="text" name="username" required class="form-control" placeholder="Enter username">
            </div>
        </div>

        <div class="mb-4 position-relative">
            <label class="form-label text-secondary small fw-semibold">Password</label>
            <div class="position-relative">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" name="password" required class="form-control" placeholder="Enter password">
            </div>
        </div>

        <button type="submit" class="btn btn-signin mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
        </button>

        <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
            <span class="text-secondary small">Don't have an account yet?</span>
            <a href="{% url 'register' %}" class="link-muted small fw-bold ms-1 text-emerald">Create Account &rarr;</a>
        </div>
    </form>
</div>

</body>
</html>
