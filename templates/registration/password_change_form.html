{% extends "base.html" %}
{% load widget_tweaks %}

{% block content %}

<div class="card shadow">

<div class="card-header bg-primary text-white">

Change Password

</div>

<div class="card-body">

<form method="post">

{% csrf_token %}

{% for field in form %}

<div class="mb-3">

<label>

{{ field.label }}

</label>

{{ field|add_class:"form-control" }}

</div>

{% endfor %}

<button
class="btn btn-success">

Change Password

</button>

</form>

</div>

</div>

{% endblock %}
