{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card p-4" style="background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);">
            <h3 class="fw-bold text-white mb-3">
                <i class="bi bi-pencil-square text-emerald me-2"></i> {% if category %}Edit Category: {{ category.name }}{% else %}Add New Category{% endif %}
            </h3>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold">Category Name</label>
                    <input type="text" name="name" required class="form-control" value="{% if category %}{{ category.name }}{% else %}{{ form.name.value|default:'' }}{% endif %}" placeholder="e.g. Travel, Dining, Groceries">
                </div>

                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold">Theme Color</label>
                    <input type="color" name="color" class="form-control form-control-color w-100" value="{% if category %}{{ category.color|default:'#10B981' }}{% else %}{{ form.color.value|default:'#10B981' }}{% endif %}" title="Choose Theme Color">
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'category_list' %}" class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-success px-4" style="background: linear-gradient(135deg, #10B981, #059669); border: none;">
                        <i class="bi bi-check-circle me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
