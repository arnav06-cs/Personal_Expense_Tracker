{% extends "base.html" %}
{% load widget_tweaks %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-8">
        <div class="card p-4" style="background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);">
            <h3 class="fw-bold text-white mb-3">
                <i class="bi bi-pencil-square text-emerald me-2"></i> {{ title|default:"Edit Expense" }}
            </h3>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label text-secondary fw-semibold">
                        {{ field.label }}
                    </label>
                    {{ field|add_class:"form-control" }}
                    {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{% url 'expense_list' %}" class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-success px-4" style="background: linear-gradient(135deg, #10B981, #059669); border: none;">
                        <i class="bi bi-check-circle me-1"></i> Save Expense
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
